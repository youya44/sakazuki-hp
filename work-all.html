<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WORK｜株式会社SAKAZUKI</title>
  <meta name="description" content="株式会社SAKAZUKIの制作実績一覧。デザイン、Web、映像、イベントの制作事例をご紹介します。">
  <link rel="icon" type="image/webp" href="assets/images/logo-icon.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header class="header" id="header">
    <a href="/" class="header-logo">
      <img src="assets/images/logo.webp" alt="SAKAZUKI">
    </a>
    <button class="header-menu" id="menuBtn" type="button" aria-label="メニュー">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <!-- Mobile Nav -->
  <nav class="nav-overlay" id="navOverlay">
    <div class="nav-inner">
      <a href="/" class="nav-link">TOP</a>
      <a href="/#about" class="nav-link">ABOUT</a>
      <a href="/#business" class="nav-link">BUSINESS</a>
      <a href="/#service" class="nav-link">SERVICE</a>
      <a href="/#work" class="nav-link">WORK</a>
      <a href="/#news" class="nav-link">NEWS</a>
      <a href="/#company" class="nav-link">COMPANY</a>
      <a href="/#contact" class="nav-link">CONTACT</a>
    </div>
  </nav>

  <!-- Decorative Elements -->
  <div class="deco deco-gradient-1"></div>
  <div class="deco deco-gradient-2"></div>
  <div class="deco deco-outline-1"></div>
  <div class="deco deco-outline-2"></div>

  <!-- Fixed Background Video -->
  <video class="bg-video-fixed" autoplay muted loop playsinline>
    <source src="assets/bg-video.mp4" type="video/mp4">
  </video>

  <main>

    <!-- Hero -->
    <section class="section section-subhero section-subhero-simple">
      <div class="section-inner">
        <div class="section-header">
          <h1 class="section-title-en">WORK</h1>
          <p class="section-title-ja">制作実績</p>
        </div>
      </div>
    </section>

    <!-- Filter + Grid -->
    <section class="section section-work-all">
      <div class="section-inner">
        <div class="work-filter">
          <button class="work-filter-btn active" data-filter="all">All</button>
          <button class="work-filter-btn" data-filter="movie">Movie</button>
          <button class="work-filter-btn" data-filter="web">Web</button>
          <button class="work-filter-btn" data-filter="design">Design</button>
          <button class="work-filter-btn" data-filter="event">Event</button>
        </div>
        <div class="work-grid work-grid-3col" id="workGrid">
          <a href="work/genkai-don.html" class="work-item" data-category="design">
            <img src="assets/images/work1.webp" alt="玄海丼 ブランディング">
          </a>
          <a href="work/lapo-event.html" class="work-item" data-category="design">
            <img src="assets/images/work2.webp" alt="lapo イベントポスター">
          </a>
          <a href="work/golden-route.html" class="work-item" data-category="design">
            <img src="assets/images/work3.webp" alt="GOLDEN ROUTE TO WEST JAPAN">
          </a>
          <a href="work/seikotsuin.html" class="work-item" data-category="design">
            <img src="assets/images/work4.webp" alt="整骨院チラシ">
          </a>
          <a href="work/iciem-kyoto.html" class="work-item" data-category="design">
            <img src="assets/images/work5.webp" alt="ICIEM 2025 KYOTO">
          </a>
        </div>
        <div class="section-more" style="justify-content: center; margin-top: 60px;">
          <button class="btn-show-more" id="showMoreBtn">Show more</button>
        </div>
      </div>
    </section>

    <!-- CONTACT -->
    <section class="section section-contact" id="contact">
      <div class="section-inner">
        <div class="section-header">
          <h2 class="section-title-en">CONTACT</h2>
          <p class="section-title-ja">お問い合わせ</p>
        </div>
        <form class="contact-form" id="contactForm">
          <div class="form-group">
            <label for="company-name" class="form-label">Company</label>
            <input type="text" id="company-name" name="company" class="form-input" placeholder="例）（株）XXXXX">
          </div>
          <div class="form-group">
            <label for="name" class="form-label">Name <span class="required">*</span></label>
            <input type="text" id="name" name="name" class="form-input" placeholder="ご氏名" required>
          </div>
          <div class="form-group">
            <label for="email" class="form-label">Email <span class="required">*</span></label>
            <input type="email" id="email" name="email" class="form-input" placeholder="例）xxx@xxxx.ne.jp" required>
          </div>
          <div class="form-group">
            <label for="message" class="form-label">Message <span class="required">*</span></label>
            <textarea id="message" name="message" class="form-textarea" placeholder="お問い合わせ内容をご入力ください" required></textarea>
          </div>
          <div class="form-check">
            <input type="checkbox" id="privacy" name="privacy" required>
            <label for="privacy">プライバシーポリシーに同意する</label>
          </div>
          <p class="form-note">当サイトのフォームを利用した当社への売り込みの一切をお断りしています。</p>
          <button type="submit" class="btn-send">Send</button>
        </form>
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-left">
        <img src="assets/images/logo.webp" alt="SAKAZUKI" class="footer-logo">
        <p class="footer-tagline">Take it easy, Make it better.</p>
        <p class="footer-sub">We are a production company in Fukuoka, Japan.</p>
      </div>
      <nav class="footer-nav">
        <div class="footer-nav-col">
          <a href="recruit.html">RECRUIT</a>
          <a href="/#business">BUSINESS</a>
          <a href="/#service">SERVICES</a>
          <a href="/#work">WORK</a>
        </div>
        <div class="footer-nav-col">
          <a href="/#news">NEWS</a>
          <a href="/#company">COMPANY</a>
          <a href="/#contact">CONTACT</a>
        </div>
      </nav>
    </div>
    <p class="footer-copy">&copy; 2024 SAKAZUKI.Inc All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
